[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motrust-omics"
version = "0.1.0"
description = "Adaptive semantic protection and molecular recovery for mosaic single-cell multi-omics"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "MoTRUST contributors"}]
dependencies = [
    "anndata>=0.10,<0.13", "numpy>=1.24,<3", "pandas>=2.0,<3",
    "scikit-learn>=1.3,<2", "scipy>=1.10,<2", "torch>=2.2", "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "pytest-cov>=5", "ruff>=0.8"]
reproduce = ["joblib>=1.3", "matplotlib>=3.7", "seaborn>=0.12"]

[project.scripts]
motrust = "motrust.cli:main"
motrust-recovery = "motrust.training.recovery:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
motrust = ["resources/**/*.json", "resources/**/*.csv", "resources/**/*.R"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
